name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Torch is intentionally excluded to keep CI fast — torch-dependent
      # tests skip themselves via pytest.importorskip.
      - name: Install dependencies
        run: pip install numpy scipy pandas scikit-learn matplotlib pytest

      - name: Run tests
        run: pytest tests/ -v
